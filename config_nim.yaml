# Model server settings. Read by nim_config.py.
# To switch models, change "model" to the name the server was started with
# (vLLM: the value of --served-model-name). Restart app.py afterwards.
#
# Do NOT put API keys in this file - the repo is public.
# If a key is needed, set it in the terminal instead:  export NIM_API_KEY=...
nim:
  base_url: "http://localhost:8888/v1/chat/completions"
  model: "qwen3.8-27b-exl3-4.0bpw"
  # Skip the model's long "thinking" step for faster, more reliable short answers
  disable_thinking: true
  # Qwen one-click kit folder, so the UI's AI card can start/stop it
  server_dir: "~/Qwen3.8-27B-16gb-NVIDIA-GPUS-one-click-install"